services:
  - type: web
    name: esg-v1
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python start.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: PYTHONUNBUFFERED
        value: "1"
  - type: web
    name: esg-learn
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn v2.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /daily
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: PYTHONUNBUFFERED
        value: "1"
